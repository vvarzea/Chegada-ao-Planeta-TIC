<!--   ESTRELAS E METEOROS NO FUNDO (AGORA POR CIMA)           -->
<!-- ========================================================= -->

<style>
/* ======== ESTRELAS A CAIR E A BRILHAR ✨ POR CIMA ======== */
.star {
  position: fixed;
  top: -10px;
  width: 3px;
  height: 3px;
  background: white;
  border-radius: 50%;
  opacity: 0.9;
  pointer-events: none;
  z-index: 9999; /* ⭐ AGORA PASSAM POR CIMA DE TUDO */
  animation: starFall linear infinite, starTwinkle ease-in-out infinite;
}

/* Queda vertical simples */
@keyframes starFall {
  0% {
    transform: translateY(0);
    opacity: 1;
  }
  100% {
    transform: translateY(110vh);
    opacity: 0;
  }
}

/* Brilho pulsante */
@keyframes starTwinkle {
  0%, 100% { opacity: 0.2; transform: scale(1); }
  50%      { opacity: 1; transform: scale(1.5); }
}

/* ======== METEOROS 🌠 (POR CIMA) ======== */
.meteor {
  position: fixed;
  top: -20px;
  width: 8px;
  height: 8px;
  background: linear-gradient(135deg,#facc15,#f97316);
  border-radius: 50%;
  box-shadow: 0 0 10px rgba(250,204,21,0.9);
  pointer-events: none;
  z-index: 9999; /* meteoros passam por cima também */
  transform-origin: center;
  animation: meteorFall linear forwards;
}

/* Trajetória diagonal */
@keyframes meteorFall {
  0% {
    transform: translate3d(0,0,0) rotate(45deg);
    opacity: 1;
  }
  100% {
    transform: translate3d(-80vw,110vh,0) rotate(45deg);
    opacity: 0;
  }
}
</style>

<script>
/* ================= GERADOR DE ESTRELAS E METEOROS ================= */
function criarEstrela() {
  const estrela = document.createElement("div");
  estrela.classList.add("star");

  const t = Math.random() * 3 + 1;
  estrela.style.width = t + "px";
  estrela.style.height = t + "px";

  estrela.style.left = Math.random() * window.innerWidth + "px";

  const durQueda = Math.random() * 4 + 4;
  const durBrilho = Math.random() * 1.5 + 1.5;
  estrela.style.animationDuration = durQueda + "s, " + durBrilho + "s";

  document.body.appendChild(estrela);
  setTimeout(() => estrela.remove(), durQueda * 1000);
}

setInterval(criarEstrela, 120);

/* ---- Meteoros ---- */
function criarMeteoro() {
  const m = document.createElement("div");
  m.classList.add("meteor");

  m.style.left = window.innerWidth * (0.6 + Math.random() * 0.4) + "px";

  const dur = Math.random() * 3 + 4;
  m.style.animationDuration = dur + "s";

  document.body.appendChild(m);
  setTimeout(() => m.remove(), dur * 1000);
}

function cicloMeteoros() {
  criarMeteoro();
  const delay = 4000 + Math.random() * 6000;
  setTimeout(cicloMeteoros, delay);
}

window.addEventListener("load", cicloMeteoros);
</script>

<script>
/* ======== Sons retro ======== */
let audioCtx = null;

function playBeep(type) {
  if (!window.AudioContext && !window.webkitAudioContext) return;
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const ctx = audioCtx;

  if (type === 'fim') {
    const notes = [660, 880, 990, 1320, 1760];
    const now = ctx.currentTime;
    notes.forEach((freq, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'square';
      o.frequency.value = freq;
      o.connect(g);
      g.connect(ctx.destination);
      const start = now + i * 0.16;
      const end = start + 0.15;
      g.gain.setValueAtTime(0.2, start);
      g.gain.exponentialRampToValueAtTime(0.0001, end);
      o.start(start);
      o.stop(end);
    });
    return;
  }

  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.connect(g);
  g.connect(ctx.destination);
  o.type = 'square';

  let freq = 880;
  let dur  = 0.18;

  if (type === 'erro') { freq = 220; dur = 0.25; }
  if (type === 'neutro') { freq = 500; dur = 0.15; }

  const now = ctx.currentTime;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.18, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o.start(now);
  o.stop(now + dur);
}

/* ======== Dança VanBerto ======== */
function danceVanBerto() {

/* ======== Progresso automático ======== */
const visited = new Set();
const TOTAL = Object.keys(cenas).length;

function atualizarProgresso(id) {
  if (id === "inicio") visited.clear();
  visited.add(id);

  const pct = Math.round((visited.size / TOTAL) * 100);
  document.getElementById("progress-fill").style.width = pct + "%";
  document.getElementById("progress-text").innerText =
    "Progresso da missão: " + pct + "%";
}

/* ======== Motor do jogo ======== */
function mostrarCena(id) {
  const c = cenas[id];
  document.body.className = c.bg;
  atualizarProgresso(id);

  document.getElementById("tituloCena").innerText = c.titulo;
  document.getElementById("fala").innerText = c.fala;
  document.getElementById("pergunta").innerText = c.pergunta;

  const div = document.getElementById("choices");
  div.innerHTML = "";

  c.opcoes.forEach(op => {
    const btn = document.createElement("button");
    btn.innerText = op.texto;

    btn.onclick = () => {
      playBeep(op.som);
      if (op.som === "ok" || op.som === "fim") danceVanBerto();
      setTimeout(() => mostrarCena(op.next), 240);
    };

    div.appendChild(btn);
  });
}

mostrarCena("inicio");
</script>
