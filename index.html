*{box-sizing:border-box}
html,body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;transition:background .4s}
.s0{background:radial-gradient(circle at top,#38bdf8,#020617 65%)}
.s1{background:radial-gradient(circle at top,#22c55e,#052e16 65%)}
.s2{background:radial-gradient(circle at top,#4f46e5,#020617 65%)}
.s3{background:radial-gradient(circle at top,#a855f7,#1e1b4b 65%)}
.s4{background:radial-gradient(circle at top,#0ea5e9,#0f172a 65%)}
.s5{background:radial-gradient(circle at top,#fb7185,#4a044e 65%)}
.s6{background:radial-gradient(circle at top,#ef4444,#450a0a 65%)}
.s7{background:radial-gradient(circle at top,#facc15,#78350f 65%)}
.sf{background:radial-gradient(circle at top,#22c55e,#14532d 65%)}
.star,.meteor,.confetti{position:fixed;pointer-events:none;z-index:9999}
.star{top:-10px;background:#fff;border-radius:50%;animation:fall linear forwards,tw ease-in-out infinite}
@keyframes fall{to{transform:translateY(110vh)}}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.meteor{top:-20px;width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#facc15,#f97316);box-shadow:0 0 10px #facc15;animation:met linear forwards}
@keyframes met{to{transform:translate3d(-80vw,110vh,0)}}
.confetti{width:8px;height:14px;border-radius:2px;top:-10px;animation:conf linear forwards}
@keyframes conf{to{transform:translate3d(0,110vh,0) rotate(360deg)}}
#game{width:100%;max-width:960px;margin:16px;padding:18px 20px 14px;background:rgba(248,250,252,.96);border-radius:24px;box-shadow:0 16px 40px rgba(15,23,42,.55);position:relative;z-index:2}
#bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#0ea5e9);transition:width .3s}
#top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:8px 0}
#prog{font-weight:700;color:#0f172a;font-size:.9rem}
.box{display:inline-block;background:linear-gradient(135deg,#eef2ff,#e0f2fe);border-radius:99px;padding:5px 12px;font-size:.9rem;margin-left:6px;box-shadow:0 2px 6px rgba(15,23,42,.12)}
#snd,#vz{border:0;background:#e0e7ff;border-radius:99px;padding:6px 12px;font-size:.85rem;cursor:pointer;margin-left:6px}
#hero{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:6px 0}
#vb{width:130px;flex:none;filter:drop-shadow(0 0 8px rgba(125,211,252,.7))}
#vb canvas{width:100%;height:auto;display:block;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.vb-eyelid{transform-origin:40px 23px;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.vb-arm{transform-origin:63px 44px;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,50%,100%{transform:rotate(0)}25%,75%{transform:rotate(-16deg)}}
#vb.glow canvas{animation:glow .45s}
#vb.shake canvas{animation:shake .3s}
#vb.dance canvas{animation:dance .9s}
@keyframes glow{50%{filter:drop-shadow(0 0 18px #7dd3fc);transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes dance{15%{transform:translateX(-8px) rotate(-10deg)}30%{transform:translateX(8px) rotate(8deg)}45%{transform:translateX(-6px) skewX(-10deg)}60%{transform:translateX(6px) skewX(10deg)}80%{transform:translateX(-4px) rotate(-8deg)}}
#talk{flex:1;min-width:220px;max-width:560px;text-align:left}
#zone{font-size:.8rem;letter-spacing:.12em;color:#6b7280;text-transform:uppercase}
#title{font-size:1.35rem;font-weight:800;color:#020617;margin:2px 0}
#fala{background:#e0f2fe;border-radius:16px;padding:10px 14px;color:#0f172a;font-size:1rem}
#mission{background:radial-gradient(circle at top left,#e5edff,#fff 60%);border-radius:18px;padding:12px;min-height:200px;margin-top:8px;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.panel{background:#fff;border-radius:16px;padding:10px;box-shadow:0 4px 12px rgba(15,23,42,.1)}
.pt{font-weight:700;margin-bottom:6px;color:#111827}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:6px}
.tag{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:110px;padding:8px 14px;border-radius:14px;border:2px solid transparent;background:#fff;box-shadow:0 1px 4px rgba(15,23,42,.15);cursor:pointer;font-size:1rem;text-align:center;user-select:none;transition:transform .12s}
.tag:hover{transform:translateY(-1px)}
.selected{border-color:#4f46e5;background:#e0e7ff}
.correct{border-color:#16a34a;background:#dcfce7}
.wrong{border-color:#dc2626;background:#fee2e2;animation:shake .25s}
.disabled{opacity:.6;pointer-events:none}
.stmt{margin-bottom:8px;text-align:center}

/* ===== Tema lúdico (igual à Hora do Código): creme com pontinhos, contornos azul-escuros e sombras duras ===== */
:root{--tx:#1e1b4b;--bd:#1e1b4b;--sh:#1e1b4b;--card:#fff;--card2:#fafbff;--card3:#fffdf5;--ink:#1e1b4b;--sun:#ffd23f;--coral:#ff6b6b;--mint:#2ee6a6;--sky:#4cc9f0;--grape:#7c3aed;--cream:#fff8e7;--acc:#4cc9f0}

body.s4{--acc:#7dd3fc}body.s5{--acc:#ffb3c1}body.s6{--acc:#ff9a8b}body.s7{--acc:#ffd23f}body.sf{--acc:#2ee6a6}
body,button,input{font-family:'Nunito','Nunito Sans',system-ui,-apple-system,sans-serif}

body[class]{background:radial-gradient(rgba(255,150,60,.30) 1.4px,transparent 1.6px) 0 0/22px 22px,var(--cream);color:var(--tx);-webkit-tap-highlight-color:transparent}

body{flex-direction:column;align-items:center;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
#wrap{width:100%;max-width:980px;margin:16px auto 0;padding:0 16px}

#htxt{text-align:center}

#htxt p{margin:4px 0 0;font:700 1.05rem 'Fredoka One','Nunito',sans-serif;color:#475569;letter-spacing:.3px}
#game{max-width:none;width:100%;margin:16px 0 0;padding:16px 18px 14px;background:var(--card2);border:3px solid var(--bd);border-radius:24px;box-shadow:0 6px 0 var(--sh)}

#fill{background:repeating-linear-gradient(135deg,var(--mint) 0 12px,#6ff2c4 12px 24px);background-size:34px 34px;animation:stripes 1s linear infinite;transition:width .5s cubic-bezier(.3,1.4,.5,1)}

.box,#snd,#vz{background:var(--card);color:var(--tx);border:2.5px solid var(--bd);border-radius:99px;box-shadow:0 3px 0 var(--sh);font-weight:800;font-size:.9rem}

/* ===== Trilho de missões (substitui a barra) ===== */

/* ===== Robô ===== */
function rrVan(ctx,x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath();
}
function cfVan(ctx,x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}

function drawVBAtual(ctx,blink,step,armsUp){
  const w=96,h=96;
  ctx.clearRect(0,0,w,h);
  ctx.lineJoin="round"; ctx.lineCap="round";
  ctx.save(); ctx.translate(0,6);

  function white(x0,y0,x1,y1){const g=ctx.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,"#ffffff");g.addColorStop(0.55,"#e6edf7");g.addColorStop(1,"#b4c4dc");return g;}

  const LIFT=8, STRIDE=3;

  function leg(cx,top){
    rrVan(ctx,cx-5,top,10,11,4.5); ctx.fillStyle=white(cx-5,top,cx+5,top); ctx.fill();
    ctx.lineWidth=2.6; ctx.strokeStyle=OUT; ctx.stroke();
    const fy=top+9;
    rrVan(ctx,cx-6.5,fy,13,9,4); ctx.fillStyle=NAVY; ctx.fill();
    ctx.lineWidth=2.6; ctx.strokeStyle=OUT; ctx.stroke();
    rrVan(ctx,cx-6.5,fy+2,13,2.4,1.2); ctx.fillStyle="rgba(255,255,255,0.85)"; ctx.fill();
    cfVan(ctx,cx-2.5,fy+4.5,1.4,"rgba(255,255,255,0.5)");
  }
  leg(41+lDX,lTop); leg(55+rDX,rTop);

  const ARM_SWING = 0.24;
  const JUMP_RAISE = 2.9;
  let lArmSwing = 0, rArmSwing = 0;
  if(armsUp){ lArmSwing = JUMP_RAISE; rArmSwing = -JUMP_RAISE; }
  else if(step===0){ lArmSwing=-ARM_SWING; rArmSwing=ARM_SWING; }
  else if(step===1){ lArmSwing=ARM_SWING; rArmSwing=-ARM_SWING; }
  function arm(sx,swing){
    ctx.save();
    const px=sx+4.5, py=52;
    ctx.translate(px,py); ctx.rotate(swing); ctx.translate(-px,-py);
    rrVan(ctx,sx,52,9,13,4.5); ctx.fillStyle=white(sx,52,sx+9,52); ctx.fill();
    ctx.lineWidth=2.6; ctx.strokeStyle=OUT; ctx.stroke();
    const hx=sx+4.5, hy=67;
    cfVan(ctx,hx,hy,5,NAVY);
    ctx.lineWidth=2.3; ctx.strokeStyle=OUT; ctx.beginPath(); ctx.arc(hx,hy,5,0,Math.PI*2); ctx.stroke();
    cfVan(ctx,hx-2,hy+1.6,1.4,NAVY2); cfVan(ctx,hx+0.5,hy+2.4,1.4,NAVY2); cfVan(ctx,hx+2.5,hy+1.6,1.4,NAVY2);
    ctx.restore();
  }
  arm(17,lArmSwing); arm(70,rArmSwing);

  rrVan(ctx,26,44,44,32,15); ctx.fillStyle=white(28,46,68,46); ctx.fill();
  ctx.save(); rrVan(ctx,26,44,44,32,15); ctx.clip();
  const wg=ctx.createLinearGradient(0,64,0,76); wg.addColorStop(0,"rgba(22,35,62,0)"); wg.addColorStop(0.4,"#1c2c4c"); wg.addColorStop(1,"#142038");
  ctx.fillStyle=wg; ctx.fillRect(26,62,44,16);
  ctx.strokeStyle="rgba(16,26,48,0.6)"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(28,64); ctx.lineTo(68,64); ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,0.5)"; ctx.beginPath(); ctx.ellipse(36,52,9,5.5,-0.5,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.lineWidth=3; ctx.strokeStyle=OUT; rrVan(ctx,26,44,44,32,15); ctx.stroke();

  cfVan(ctx,48,56,8,NAVY);
  ctx.lineWidth=2.5; ctx.strokeStyle=OUT; ctx.beginPath(); ctx.arc(48,56,8,0,Math.PI*2); ctx.stroke();
  const dome=ctx.createRadialGradient(45.5,53.5,1,48,56,7); dome.addColorStop(0,"#aebccf"); dome.addColorStop(0.6,"#5a6a85"); dome.addColorStop(1,"#2b3a57");
  ctx.fillStyle=dome; ctx.beginPath(); ctx.arc(48,56,5.7,0,Math.PI*2); ctx.fill();
  cfVan(ctx,46,53.8,1.5,"rgba(255,255,255,0.85)");

  function pod(cx){
    cfVan(ctx,cx,32,6,NAVY);
    ctx.lineWidth=2.3; ctx.strokeStyle=OUT; ctx.beginPath(); ctx.arc(cx,32,6,0,Math.PI*2); ctx.stroke();
    cfVan(ctx,cx,32,2.8,NAVY2); cfVan(ctx,cx-0.8,31,1,"rgba(255,255,255,0.6)");
  }
  pod(25); pod(71);

  ctx.fillStyle=NAVY; ctx.beginPath(); ctx.moveTo(45,16); ctx.lineTo(51,16); ctx.lineTo(49.2,8); ctx.lineTo(46.8,8); ctx.closePath(); ctx.fill();
  const halo=ctx.createRadialGradient(48,5,1,48,5,11); halo.addColorStop(0,"rgba(90,200,255,0.55)"); halo.addColorStop(1,"rgba(90,200,255,0)");
  ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(48,5,11,0,Math.PI*2); ctx.fill();
  const bg=ctx.createRadialGradient(46.3,3.5,0.5,48,5,5.5); bg.addColorStop(0,"#e6f7ff"); bg.addColorStop(0.4,"#48b4ff"); bg.addColorStop(1,"#1670d8");
  ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(48,5,5.5,0,Math.PI*2); ctx.fill();
  cfVan(ctx,46.2,3.4,1.6,"#ffffff");

  rrVan(ctx,26,14,44,34,17); ctx.fillStyle=white(28,15,68,15); ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle=OUT; ctx.stroke();
  ctx.save(); rrVan(ctx,26,14,44,34,17); ctx.clip();
  ctx.fillStyle="rgba(255,255,255,0.6)"; ctx.beginPath(); ctx.ellipse(38,19,10,4,-0.5,0,Math.PI*2); ctx.fill(); ctx.restore();

  rrVan(ctx,30,20,36,23,12); ctx.fillStyle=NAVY; ctx.fill();
  rrVan(ctx,32.5,22,31,19,10);
  const vg=ctx.createLinearGradient(0,22,0,41); vg.addColorStop(0,"#7fd4ff"); vg.addColorStop(0.5,"#2a9bf0"); vg.addColorStop(1,"#1366c6");
  ctx.fillStyle=vg; ctx.fill();
  ctx.save(); rrVan(ctx,32.5,22,31,19,10); ctx.clip();
  ctx.fillStyle="rgba(255,255,255,0.45)"; ctx.beginPath(); ctx.ellipse(42,25,9,3.5,-0.4,0,Math.PI*2); ctx.fill(); ctx.restore();

  if(!blink){

    ctx.lineWidth=3.2; ctx.strokeStyle="#0a0f1c"; ctx.lineCap="round";
    ctx.beginPath(); ctx.arc(41,31,3.9,0.10*Math.PI,0.90*Math.PI); ctx.stroke();

    cfVan(ctx,33.5,35.5,3,"rgba(255,120,120,0.55)");
    cfVan(ctx,62.5,35.5,3,"rgba(255,120,120,0.55)");
  } else if(blink==="sad"){
    ctx.strokeStyle="#0a0f1c"; ctx.lineWidth=2.3; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(37,24); ctx.lineTo(44.5,27); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(59,24); ctx.lineTo(51.5,27); ctx.stroke();
    ctx.fillStyle="#0a0f1c";
    ctx.beginPath(); ctx.ellipse(41,32,2.8,3.1,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(55,32,2.8,3.1,0,0,Math.PI*2); ctx.fill();
    cfVan(ctx,42,30.7,1.1,"#fff"); cfVan(ctx,56,30.7,1.1,"#fff");
    ctx.fillStyle="#6fd0ff";
    ctx.beginPath();
    ctx.moveTo(56,35); ctx.quadraticCurveTo(59,40,56,43.5); ctx.quadraticCurveTo(53,40,56,35);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.lineWidth=3; ctx.strokeStyle="#0a0f1c";
    ctx.beginPath(); ctx.arc(41,31,3.5,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(55,31,3.5,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  }
  ctx.fillStyle="#0a0f1c";
  if(blink==="wink"){
    ctx.beginPath(); ctx.ellipse(48,36,5.6,3.6,0,0,Math.PI); ctx.fill();
    ctx.fillStyle="#ff7a7a";
    ctx.beginPath(); ctx.ellipse(48,37.6,2.9,1.7,0,0,Math.PI); ctx.fill();

const CV=['fvb'].map(i=>{const c=$(i),x=c.getContext('2d'),D=Math.min(devicePixelRatio||1,3);c.width=c.height=96*D;x.scale(D,D);return x});
const draw=(b,s,a)=>CV.forEach(x=>drawVBAtual(x,b,s,a));

function bub(t){const b=$('fbub');b.textContent=t;b.classList.add('show');clearTimeout(bt);bt=setTimeout(()=>b.classList.remove('show'),3500)}
function robot(m){quiet=Date.now()+2500;
  [$('fvb')].forEach(e=>{e.classList.remove('glow','shake','dance');void e.offsetWidth;e.classList.add(m);setTimeout(()=>e.classList.remove(m),900)});
  play(m==='glow'?[['happy',-1,true,800]]:m==='shake'?[['sad',-1,false,1300]]:[['wink',0,false,180],['happy',1,true,180],['happy',0,true,180],['happy',1,true,180],['wink',-1,true,500]])}
draw(false,-1,false);

setInterval(()=>{if(document.hidden||REDUCED||Date.now()<quiet)return;const r=Math.random();
  r<.3?play([['happy',-1,true,500]]):r<.6?play([[false,0,false,170],[false,1,false,170],[false,0,false,170],[false,1,false,170]]):play([[true,-1,false,180]])},3600);
const hint=()=>{const m=curM;robot('glow');bub(m?(m.d||m.f):'Olá!')};
let drag=null,mv=0;const FW=$('fw');

function seeRounds(b){return shuf(b.pool).slice(0,b.n||6).map(it=>{
  if(typeof it==='string'){const o=[[null,PN[it],1],...shuf(ALLK.filter(k=>k!==it)).slice(0,3).map(k=>[null,PN[k],0])];return{q:'Que peça é esta?',img:it,d:FN[it],o:shuf(o)}}
  const o=[[it.a,null,1],...shuf(ALLK.filter(k=>k!==it.a)).slice(0,3).map(k=>[k,null,0])];return{q:it.q,d:FN[it.a],o:shuf(o)}})}
ENG.see=(m,box,done)=>{let r=0;const p=el('div','panel');box.append(p);
  const show=()=>{p.textContent='';const R=m.rounds[r];let fin=false;
    p.append(el('div','pt',`${r+1} de ${m.rounds.length} · ${R.q}`));
    if(R.img)p.append(imgEl(R.img,'bigimg'));
    const g=el('div','qo2');
    R.o.forEach(([k,t,c])=>{const b=el('button','o');
      if(k)b.append(imgEl(k),el('span','cap',PN[k]));else b.append(el('span','',t));
      b.onclick=()=>{if(fin||b.classList.contains('disabled'))return;
        if(c){fin=true;right(R.d);b.classList.add('correct');g.classList.add('rev');g.querySelectorAll('.o').forEach(x=>x.classList.add('disabled'));
          setTimeout(()=>{++r<m.rounds.length?show():done()},1600)}
        else{wrong(R.d);b.classList.add('wrong','disabled')}};
      g.append(b)});
    p.append(g)};

function start(i){
  cur=i;const mi=SEQ[i],base=M[mi];let m=Object.assign({},base);
  if(base.v)Object.assign(m,base.v[Math.floor(Math.random()*base.v.length)]);
  if(base.k==='judge')m.s=shuf(base.pool).slice(0,6);
  if(base.k==='see')m.rounds=seeRounds(base);
  if(base.k==='pick'){const sf=base.pool.filter(x=>x[1]),dg=base.pool.filter(x=>!x[1]);m.p=[...shuf(sf).slice(0,4),...shuf(dg).slice(0,4)]}
  curM=m;
  document.body.className='s'+(mi%8);$('game').style.setProperty('--pc',COLORS[mi%8]);showGame(true);
  $('prog').textContent=(train?'Treino ':'Missão ')+`${i+1} de ${SEQ.length}`;trail();
  $('zone').textContent=m.z;$('title').textContent=`Missão ${mi+1} – ${m.t}`;$('fala').textContent=m.f;
  $('mission').replaceWith(Object.assign(el('div'),{id:'mission'}));
  fb('');next.style.display='none';$('again').style.display=$('dip').style.display=$('train').style.display='none';
  ENG[m.k](m,$('mission'),()=>{clearInterval(tmr);$('tm').style.display='none';
    next.textContent=i===SEQ.length-1?'Ver resultado final →':'Próxima missão →';next.style.display='inline-block';
    const er=errs[mi]||0,n=er===0?3:er<=2?2:1;starsOf[mi]=n;ST[mi]=Math.max(ST[mi]||0,n);saveST();$('fb').textContent+=' · '+'🌟'.repeat(n)+'☆'.repeat(3-n)});
  timer();say(m.f)}

next.onclick=()=>{clearInterval(tmr);beep(SND.next);cur+1<SEQ.length?start(cur+1):final()};
$('dip').onclick=()=>{if(!name){PEND=1;nameModal();return}showDip()};
$('again').onclick=()=>{train=false;SEQ=LASTSEQ.slice();Object.keys(starsOf).forEach(k=>delete starsOf[k]);ok=bad=pts=streak=0;errs.length=0;upd();start(0)};
$('train').onclick=()=>{const todo=M.map((_,k)=>k).filter(k=>errs[k]);if(!todo.length)return;train=true;SEQ=todo;todo.forEach(k=>errs[k]=0);ok=bad=pts=streak=0;upd();start(0)};

/* ===== Final ===== */
function final(){
  document.body.className='sf';next.style.display='none';clearInterval(tmr);$('tm').style.display='none';trail(true);
  const left=M.map((_,k)=>k).filter(k=>errs[k]);
  const sl=k=>'🌟'.repeat(starsOf[k]||0)+'☆'.repeat(3-(starsOf[k]||0));
  const rows=SEQ.map(k=>`<div class="sti"><span>${PL[k]} ${M[k].t}</span><span>${sl(k)}</span></div>`).join('');
  const tot=SEQ.reduce((a,k)=>a+(starsOf[k]||0),0);
  let e='🥉',t='Medalha de Bronze',x='Bom esforço! Estás a aprender e isso é fantástico.';
  if(train){e='🎯';t='Treino concluído';x=left.length?'Quase lá! Ainda podes treinar o que falta.':'Já sabes tudo! Não erraste nenhuma.'}
  else if(bad<=Math.ceil(SEQ.length*.3)){e='🥇';t='Medalha de Ouro';x='Excelente trabalho! Salvaste o Planeta TIC.'}
  else if(bad<=Math.ceil(SEQ.length*.75)){e='🥈';t='Medalha de Prata';x='Muito bem! Faltou só um bocadinho para o ouro.'}
  $('prog').textContent=train?'Treino concluído':'Missões concluídas';
  $('zone').textContent=train?'Treino':'Missão cumprida';$('title').textContent='⭐ Parabéns, '+name+'! ⭐';
  $('fala').textContent='Obrigado por me ajudares a usar o computador e a Internet em segurança!';
  let best=0,rec=false;
  if(!train){MD=[e,t];try{best=+localStorage.getItem('vbtic')||0;if(pts>best){localStorage.setItem('vbtic',pts);rec=best>0;best=pts}}catch(er){}}
  const m=$('mission');
  m.innerHTML=`<div class="final"><div class="big">${e}</div><b>${t}</b><p>⭐ <b>${pts}</b> pontos${!train&&rec?' – novo recorde! 🏆':!train&&best?' (melhor: '+best+')':''}<br>✔ Certo: <b>${ok}</b> &nbsp; ✘ Errado: <b>${bad}</b></p><p>🌟 <b>${tot}</b> de ${SEQ.length*3} estrelas</p><div class="stl">${rows}</div><p>${x}</p>${left.length?'<div class="rev"><b>Para rever:</b> '+left.map(k=>M[k].t).join(', ')+'</div>':'<p>Sem nenhum erro nas missões! 👏</p>'}</div>`;
  fb(train?'Treino concluído! 🎯':'Fantástico! Missão TIC concluída! 🚀','ok');
  $('again').style.display='inline-block';$('dip').style.display=(train||SEQ.length<M.length)?'none':'inline-block';$('train').style.display=left.length?'inline-block':'none';
  beep(SND.fim);say('Fantástico! Missão concluída!');robot('dance');
  const cs=['#f97316','#22c55e','#3b82f6','#ec4899','#eab308'];
  for(let i=0;i<(CALM?0:80);i++){const c=el('div','confetti'),d=2+Math.random()*1.8;
    c.style.cssText=`left:${Math.random()*100}vw;animation-duration:${d}s;background:${cs[i%5]}`;
    document.body.append(c);setTimeout(()=>c.remove(),d*1000)}}

function intro(){
  document.body.className='s0';cur=-1;train=false;SEQ=M.map((_,k)=>k);
  clearInterval(tmr);$('tm').style.display='none';fb('');next.style.display='none';
  $('again').style.display=$('dip').style.display=$('train').style.display='none';
  $('fname').textContent='👤 '+(name||'Herói TIC');
  showGame(false);paintHub();paintTop();bub(name?`Olá, ${name}! Escolhe uma missão!`:"Olá! Sou o VanBerto's!");play([['wink',-1,true,900]]);
  if(!name)nameModal();scrollTo(0,0)}

/* ===== Hub, nome, ajudas e diploma (estética do Quiz de Informática) ===== */
const GROUPS=[{e:'💻',n:'Computador e Hardware',c:'#ffd23f',m:[0,2,3,4,5,6,7]},{e:'🛡️',n:'Segurança e Dados',c:'#4cc9f0',m:[1,8,9,10]},{e:'🌐',n:'Internet e Cidadania',c:'#2ee6a6',m:[11,12,13,14,15,16]}];
const BUB={4:'img:cpu',5:'img:ram',6:'img:gpu'},OPENG={};
const LN={f:'😊 Nível: Fácil',n:'🙂 Nível: Normal',d:'⏱ Nível: Desafio'};
const LH={f:'Fácil: mostra uma dica quando erras.',n:'Normal: sem dicas.',d:'Desafio: 60 s por missão e pontos a dobrar.'};
function paintTop(){$('lvb').textContent=LN[lvl];$('lvh').textContent=LH[lvl];$('whb').textContent=name?'👤 '+name:'👤 Escrever o meu nome'}
function paintHub(){let got=0,best=0;M.forEach((_,k)=>got+=ST[k]||0);try{best=+localStorage.getItem('vbtic')||0}catch(e){}
  $('hs1').textContent='🧩 '+M.length+' missões';$('hs2').textContent='🌟 '+got+' / '+M.length*3;$('hs3').textContent='🏆 Recorde: '+best;
  $('hgrid').innerHTML=GROUPS.map((g,gi)=>{const open=OPENG[gi]!==false,done=g.m.filter(k=>ST[k]).length;
    return '<div class="grp" role="button" tabindex="0" data-g="'+gi+'" aria-expanded="'+open+'" style="--gc:'+g.c+'"><span class="gi">'+g.e+'</span><span class="gt">'+g.n+'</span><span class="gn">⭐ '+done+'/'+g.m.length+'</span></div>'+
    g.m.map(k=>{const st=ST[k]||0,bb=BUB[k],bi=bb?'<img src="img/'+bb.slice(4)+'.webp" alt="">':PL[k];
      return '<div class="game'+(open?'':' gh')+'" role="button" tabindex="0" data-m="'+k+'" data-g="'+gi+'" style="--gc:'+COLORS[k%8]+';--i:'+k+'"><div class="bubble">'+bi+'</div><div class="name">'+esc(M[k].t)+'</div><div class="desc">'+esc(M[k].z)+'</div><div class="stars" aria-label="'+st+' estrelas">'+(st?'🌟'.repeat(st)+'☆'.repeat(3-st):'')+'</div><div class="play">▶ Jogar</div></div>'}).join('')}).join('')}
function modal(h){const o=$('modal');o.innerHTML='<div class="mbox">'+h+'<div class="sig">© Prof.ª Vanda Várzea</div></div>';o.hidden=false}
function nameModal(){modal('<h2>👋 Como te chamas?</h2><p>O teu nome aparece no jogo e no diploma.</p><input id="nmi" maxlength="20" placeholder="O teu nome" aria-label="O teu nome" value="'+esc(name)+'"><div class="opts"><button class="btn big" id="nmok" type="button">✔️ Continuar</button></div>');setTimeout(()=>{const i=$('nmi');i&&i.focus()},50)}
function okName(){const v=$('nmi').value.trim();if(!v){$('nmi').focus();return}name=v;try{localStorage.setItem('vbtic_n',v)}catch(e){}
  $('modal').hidden=true;$('fname').textContent='👤 '+name;paintTop();bub('Olá, '+name+'! 🎉');robot('glow');if(PEND){PEND=0;showDip()}}
function go(seq){SEQ=seq;LASTSEQ=seq.slice();train=false;ok=bad=pts=streak=0;errs.length=0;Object.keys(starsOf).forEach(k=>delete starsOf[k]);upd();$('fname').textContent='👤 '+(name||'Herói TIC');start(0)}
function cfgModal(){const dk=document.documentElement.classList.contains('dark');
  const T=[['snd','🔊 Sons do jogo',sound],['vz','🗣️ Ler as missões em voz alta',voice],['dk','🌙 Modo escuro',dk],['big','🔠 Letras e imagens maiores',BIG],['calm','🌿 Modo calmo (sem confetis nem abanões)',CALM]];
  modal('<h2 style="font-size:30px">⚙️ Ajudas</h2><p>O professor escolhe o que ajuda o aluno.</p><div class="opts">'+T.map(([k,l,v])=>'<button class="btn big" type="button" data-o="'+k+'" aria-pressed="'+v+'" style="width:100%;'+(v?'':'background:var(--card)')+'">'+(v?'✅ ':'⬜ ')+l+'</button>').join('')+'<button class="btn big" type="button" id="mn2">Fechar</button></div>')}
function dipImg(){const W=1200,H=850,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),INK='#1e1b4b',col='#7c3aed';
  x.fillStyle='#fff8e7';x.fillRect(0,0,W,H);x.lineWidth=14;x.strokeStyle=INK;x.strokeRect(30,30,W-60,H-60);x.lineWidth=8;x.strokeStyle=col;x.strokeRect(52,52,W-104,H-104);
  x.textAlign='center';x.fillStyle=INK;x.font='86px "Fredoka One"';x.fillText('🎓 DIPLOMA',W/2,175);
  x.font='34px "Fredoka One"';x.fillText("O VanBerto's atesta que",W/2,250);
  let f=100;do{x.font=f+'px "Fredoka One"';f-=4}while(x.measureText(name).width>900&&f>30);x.fillStyle=col;x.fillText(name,W/2,365);
  x.fillStyle=INK;x.fillRect(W/2-380,385,760,4);
  x.font='34px "Fredoka One"';x.fillText('concluiu a Missão Planeta TIC — nível '+({f:'Fácil',n:'Normal',d:'Desafio'})[lvl],W/2,450);
  x.font='52px "Fredoka One"';x.fillText((MD[0]||'🏅')+' '+(MD[1]||''),W/2,535);
  x.font='44px "Fredoka One"';x.fillText('Pontuação: '+pts+' pontos',W/2,615);
  try{const rc=document.createElement('canvas');rc.width=rc.height=288;const rg=rc.getContext('2d');rg.scale(3,3);drawVBAtual(rg,'happy',-1,true);x.drawImage(rc,70,540,230,230)}catch(e){}
  x.font='30px "Fredoka One"';x.fillText(new Date().toLocaleDateString('pt-PT',{day:'numeric',month:'long',year:'numeric'}),W/2,745);
  x.fillRect(W-420,725,300,3);x.font='32px "Fredoka One"';x.fillText('Prof.ª Vanda Várzea',W-270,765);
  return c.toDataURL('image/png')}
function showDip(){modal('<h2>🎓 O teu diploma</h2><img id="dipimg" alt="Diploma" src="'+dipImg()+'" style="max-width:100%;border:3px solid var(--bd);border-radius:12px"><div class="opts"><button class="btn big" type="button" id="dpr">🖨️ Imprimir</button><button class="btn big" type="button" id="dsv">💾 Guardar imagem</button><button class="btn big" type="button" id="mn2">Fechar</button></div>')}
$('goall').onclick=()=>go(M.map((_,k)=>k));
$('lvb').onclick=()=>{lvl=lvl==='f'?'n':lvl==='n'?'d':'f';try{localStorage.setItem('vbtic_l',lvl)}catch(e){}paintTop()};
$('whb').onclick=nameModal;$('cfb').onclick=cfgModal;
const hubClick=e=>{const g=e.target.closest('.grp');if(g){const k=+g.dataset.g;OPENG[k]=OPENG[k]===false;paintHub();return}const c=e.target.closest('.game');if(c)go([+c.dataset.m])};
$('hgrid').addEventListener('click',hubClick);
$('hgrid').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hubClick(e)}});
$('modal').addEventListener('click',e=>{const t=e.target;
  if(t.closest('#nmok'))return okName();
  const o=t.closest('[data-o]');
  if(o){const k=o.dataset.o;if(k==='snd')$('snd').click();else if(k==='vz')$('vz').click();else if(k==='dk')$('dk').click();else if(k==='big')BIG=!BIG;else if(k==='calm')CALM=!CALM;saveO();applyO();cfgModal();return}
  if(t.closest('#dsv')){const a=document.createElement('a');a.href=$('dipimg').src;a.download='Diploma-'+name.replace(/\s+/g,'_')+'.png';a.click();return}
  if(t.closest('#dpr')){let d=$('dipPrint');if(!d){d=document.createElement('div');d.id='dipPrint';document.body.append(d)}d.innerHTML='<img alt="Diploma" src="'+$('dipimg').src+'">';document.body.classList.add('pdip');setTimeout(()=>{print();setTimeout(()=>document.body.classList.remove('pdip'),400)},100);return}
  if(t.closest('#mn2')||t===$('modal'))$('modal').hidden=true});
$('modal').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nmi')okName()});

/* ===== Pausa (tecla P), menu Mais, modo escuro e ecrã inteiro ===== */
function pause(on){if(on===paused)return;paused=on;let o=$('pauseov');
  if(on){o=el('div');o.id='pauseov';o.setAttribute('role','dialog');o.setAttribute('aria-label','Jogo em pausa');
    const bx=el('div','pbox');bx.append(el('div','pbig','⏸️'),el('h2','','Jogo em pausa'),el('p','','Ouve a professora. Quando ela disser, carrega em continuar.'));
    const b=el('button','btn','▶ Continuar');b.onclick=()=>pause(false);bx.append(b);o.append(bx);document.body.append(o);
    if(window.speechSynthesis)speechSynthesis.cancel();b.focus()}
  else if(o)o.remove()}
$('pz').onclick=()=>pause(!paused);
function goHome(){pause(false);clearInterval(tmr);$('tm').style.display='none';ok=bad=pts=streak=0;errs.length=0;Object.keys(starsOf).forEach(k=>delete starsOf[k]);upd();intro()}
$('hm').onclick=()=>{if(cur<0||document.body.className==='sf'){goHome();return}
  if($('homeov'))return;const o=el('div');o.id='homeov';o.setAttribute('role','dialog');o.setAttribute('aria-label','Voltar ao início');
  const bx=el('div','pbox');bx.append(el('div','pbig','🏠'),el('h2','','Voltar ao início?'),el('p','','Perdes o progresso desta partida. Podes mudar o nível no ecrã inicial.'));
  const s=el('button','btn','Sim, voltar'),n=el('button','btn','Continuar a jogar');
  s.onclick=()=>{o.remove();goHome()};n.onclick=()=>o.remove();bx.append(s,n);o.append(bx);document.body.append(o);n.focus()};
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='p'||e.key==='P')pause(!paused);else if(e.key==='Escape'){if(paused)pause(false);if($('homeov'))$('homeov').remove();$('modal').hidden=true;$('mm').hidden=true;$('mb').setAttribute('aria-expanded','false')}});
$('mb').onclick=e=>{e.stopPropagation();const m=$('mm');m.hidden=!m.hidden;$('mb').setAttribute('aria-expanded',String(!m.hidden))};
document.addEventListener('click',e=>{const m=$('mm');if(!m.hidden&&!e.target.closest('#mw')){m.hidden=true;$('mb').setAttribute('aria-expanded','false')}});
function dark(on){document.documentElement.classList.toggle('dark',on);$('dk').textContent=on?'☀️ Modo claro':'🌙 Modo escuro';try{localStorage.setItem('vbdark',on?'1':'0')}catch(e){}}
$('dk').onclick=()=>dark(!document.documentElement.classList.contains('dark'));
try{if(localStorage.getItem('vbdark')==='1')dark(true)}catch(e){}
if(!document.documentElement.requestFullscreen)$('fs').style.display='none';
$('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})};
upd();intro();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
